<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>休假與加班管理</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="manifest" href="manifest.webmanifest">
</head>
<body>

  <!-- 數據統計儀表板 -->
  <div class="card">
    <div class="card-header">
      <h2 class="card-title">📊 額度統計</h2>
    </div>
    <div>
      <p>特休剩餘：<span id="annualValue">0 天</span></p>
      <p>平日補休：<span id="compWdValue">0 小時</span></p>
      <p>假日補休：<span id="compWeValue">0 小時</span></p>
      <p>國定補休：<span id="holidayCompValue">0 小時</span></p>
      <hr style="margin: 8px 0; border: none; border-top: 1px solid #eee;">
      <p><strong>可休總計：<span id="totalValue">0 天</span></strong></p>
    </div>
  </div>

  <!-- 新增紀錄區塊 -->
  <div class="card">
    <div class="card-header">
      <h2 class="card-title">📝 登記休假 / 加班</h2>
    </div>
    <div style="display: flex; flex-direction: column; gap: 10px;">
      <input type="date" id="recordDate">
      <select id="recordType">
        <option value="leave_annual_wd">請特休－平日（-特休）</option>
        <option value="leave_annual_we">請特休－假日（-特休）</option>
        <option value="ot_wd">平日加班（+平日補休）</option>
        <option value="ot_we">假日加班（+假日補休）</option>
        <option value="holiday_ot">國定假日出勤（+國定補休）</option>
        <option value="leave_comp_wd">請平日補休（-平日補休）</option>
        <option value="leave_comp_we">請假日補休（-假日補休）</option>
        <option value="leave_holiday_comp">請國定假日補休（-國定補休）</option>
      </select>
      <input type="number" id="recordHours" placeholder="小時數 (例如: 8)" step="0.5" value="8">
      <p id="hint" style="font-size: 0.8rem; color: #666;"></p>
      <button id="addBtn" style="padding: 10px; background: #2563eb; color: white; border: none; border-radius: 8px; cursor: pointer;">新增紀錄</button>
    </div>
  </div>

  <!-- 滾動式異動明細 -->
  <div class="card">
    <div class="card-header">
      <h2 class="card-title">📜 異動明細</h2>
      <span class="badge" id="recordCount">0 筆</span>
    </div>

    <div class="records-wrapper">
      <div id="emptyState" style="text-align: center; color: #94a3b8; padding: 20px 0; display: none;">
        尚無任何異動紀錄
      </div>
      <!-- 滾動區域 -->
      <div id="recordsList"></div>
    </div>
  </div>

  <!-- 隱藏控制項與 Toast 提示 -->
  <div id="toast"></div>

  <script src="app.js"></script>
</body>
</html>
